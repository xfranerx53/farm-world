  apiKey: "AIzaSyDmA1n75thfA5sU4ujk4j5DMGi_nx0qiIc",

const uid=auth.currentUser.uid;

let hue=[...uid].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7)/360;

const GROW={wheat:60000,carrot:90000,tomato:120000,corn:180000,strawberry:100000,pumpkin:240000},RIPE={wheat:0xe3c94a,carrot:0xf08a24,tomato:0xd9302c,corn:0xf2d03b,strawberry:0xe8284a,pumpkin:0xf28a1a};
const ANIM={chicken:{cost:30,t:45000,item:'egg',lv:1,r:2.2,sp:1.2},cow:{cost:100,t:80000,item:'milk',lv:4,r:3,sp:.5},sheep:{cost:60,t:60000,item:'wool',lv:3,r:2.6,sp:.8}};
const PRICE={wheat:5,carrot:8,tomato:12,corn:18,egg:6,milk:14,apple:7,flour:14,bread:35,cheese:40,strawberry:15,pumpkin:30,wool:12,jam:55,pie:80,fish:10,trout:22,goldfish:80},SEED={wheat:2,carrot:3,tomato:4,corn:6,strawberry:5,pumpkin:9},LV={wheat:1,carrot:1,tomato:2,corn:3,strawberry:2,pumpkin:4};
const NAME={wheat:'Buğday',carrot:'Havuç',tomato:'Domates',corn:'Mısır',egg:'Yumurta',milk:'Süt',apple:'Elma',flour:'Un',bread:'Ekmek',cheese:'Peynir',strawberry:'Çilek',pumpkin:'Kabak',wool:'Yün',jam:'Reçel',pie:'Kabak turtası',fish:'Balık',trout:'Alabalık',goldfish:'Altın balık',strawberry_seed:'Çilek tohumu',pumpkin_seed:'Kabak tohumu',wheat_seed:'Buğday tohumu',carrot_seed:'Havuç tohumu',tomato_seed:'Domates tohumu',corn_seed:'Mısır tohumu'};
const TOOLS=[['hand','✋','El'],['hoe','⛏️','Çapa'],['wheat_seed','🌾','Buğday'],['carrot_seed','🥕','Havuç'],['tomato_seed','🍅','Domates'],['corn_seed','🌽','Mısır'],['chicken','🐔','Tavuk 30🪙'],['cow','🐄','İnek 100🪙'],['can','💧','Kova'],['tree','🌳','Elma ağacı 25🪙'],['fence','🪵','Çit 5🪙'],['flower','🌸','Çiçek 3🪙'],['house','🏠','Ev 80🪙'],['strawberry_seed','🍓','Çilek'],['pumpkin_seed','🎃','Kabak'],['sheep','🐑','Koyun 60🪙'],['path','🪨','Taş yol 2🪙'],['bench','🪑','Bank 15🪙'],['lamp','🏮','Fener 20🪙'],['well','⛲','Kuyu 40🪙'],['rod','🎣','Olta'],['barnwall','🏚️','Ahır duvarı 10🪙'],['gate','🚪','Kapı 8🪙'],['feed','🥬','Yemle (1 buğday)']];
const DECO={fence:{cost:5},flower:{cost:3},house:{cost:80,lv:3},path:{cost:2},bench:{cost:15},lamp:{cost:20,lv:2},well:{cost:40,lv:2},barnwall:{cost:10,lv:3},gate:{cost:8}};
const RC={flour:{i:{wheat:2},lv:2},bread:{i:{flour:2},lv:3},cheese:{i:{milk:2},lv:4},jam:{i:{strawberry:3},lv:2},pie:{i:{pumpkin:1,flour:1},lv:4}};
let tool='hand';

// ---- Envanter ----
let inv={coins:50,items:{wheat_seed:5,carrot_seed:3}};
const snap=await get(ref(db,'inv/'+uid));
if(snap.exists()){inv=snap.val();inv.items=inv.items||{}}
if(inv.look)hue=inv.look.h;
const have=k=>inv.items[k]||0;
const add=(k,n)=>{inv.items[k]=have(k)+n;if(inv.items[k]<=0)delete inv.items[k]};
let ac;const snd=(f,d=.12)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const lvl=()=>Math.floor(Math.sqrt((inv.xp||0)/20))+1,gain=n=>{inv.xp=(inv.xp||0)+n;snd(420+n*60);pop('+'+n+' xp')};
const season=()=>Math.floor(now()/1200000)%4,SEAS=['🌸 Bahar','☀️ Yaz','🍂 Sonbahar','❄️ Kış'],SB=[['strawberry','carrot'],['tomato','corn'],['pumpkin','wheat'],[]],SG=()=>[0x5fae4a,0x6cb83c,0xb39a3b,0xe6eef2][season()];
const gt=d=>GROW[d.k]*(d.wet?.7:1)*(season()===3?1.25:SB[season()].includes(d.k)?.75:1);
const QN={plant:['Ekim',5],harvest:['Hasat',5],sell:['Satış',5]},QB={plant:1,harvest:2,sell:4};
function qget(){if(!inv.q||inv.q.d!==Math.floor(now()/86400000))inv.q={d:Math.floor(now()/86400000),plant:0,harvest:0,sell:0,done:0};return inv.q}
function qadd(t){const q=qget();ach(t);q[t]++;if(q[t]>=QN[t][1]&&!(q.done&QB[t])){q.done|=QB[t];inv.coins+=25;gain(10);toast('Günlük görev tamam! +25🪙')}}
const qtxt=()=>{const q=qget();return Object.keys(QN).map(t=>QN[t][0]+' '+Math.min(q[t],QN[t][1])+'/'+QN[t][1]+(q.done&QB[t]?' ✅':'')).join(' · ')};
function save(){set(ref(db,'lb/'+uid),{n:myName,xp:inv.xp||0});set(ref(db,'inv/'+uid),inv);hud();renderPanel()}
function hud(){
  const L=lvl(),a=20*(L-1)**2,b=20*L*L,pc=Math.round(((inv.xp||0)-a)/(b-a)*100);
  $('stats').innerHTML=`<div class="lv">${L}</div><div class="st"><b>🪙 ${inv.coins}</b><i class="xpb"><u style="width:${pc}%"></u></i><small>${Object.entries(inv.items).map(([k,v])=>NAME[k]+' '+v).join(' · ')||'Çantan boş'}</small></div>`;
  $('bar').innerHTML=TOOLS.map((t,i)=>`<div class="slot ${t[0]===tool?'on':''}" data-t="${t[0]}">${t[1]}<br><small>${i+1}. ${t[2]}${t[0].endsWith('_seed')?' ('+have(t[0])+')':''}</small></div>`).join('');
}
$('bar').onclick=e=>{const s=e.target.closest('.slot');if(s){tool=s.dataset.t;hud()}};
await save();
// gelen satış paraları
onChildAdded(ref(db,'inbox/'+uid),s=>{inv.coins+=s.val().coins||0;remove(s.ref);save();toast('Para geldi! +'+s.val().coins+'🪙')});

// ---- Sahne ----
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad4f5);scene.fog=new THREE.Fog(0x9ad4f5,25,70);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);
const amb=new THREE.AmbientLight(0xffffff,.75);scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff0d0,.8);sun.position.set(10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;
Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:60});scene.add(sun,sun.target);scene.add(new THREE.HemisphereLight(0xcfe8ff,0x6b8f3a,.28));
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

const gg=new THREE.BoxGeometry(.98,.4,.98);gg.translate(0,-.2,0);
const ground=new THREE.InstancedMesh(gg,new THREE.MeshLambertMaterial(),N*N);
const dm=new THREE.Object3D(),col=new THREE.Color();
for(let z=0;z<N;z++)for(let x=0;x<N;x++){dm.position.set(x,0,z);dm.updateMatrix();ground.setMatrixAt(z*N+x,dm.matrix);col.setHex(0x5fae4a).multiplyScalar(.92+((x*7+z*13)%5)*.03);ground.setColorAt(z*N+x,col)}
ground.receiveShadow=true;scene.add(ground);
{const w=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x4fb0d4}));w.rotation.x=-Math.PI/2;w.position.set(N/2,-.45,N/2);scene.add(w);
const sd=new THREE.Mesh(new THREE.BoxGeometry(N+3,.3,N+3),new THREE.MeshLambertMaterial({color:0xe6d49a}));sd.position.set(N/2-.5,-.55,N/2-.5);scene.add(sd);
const tg=new THREE.CylinderGeometry(.1,.14,.8,5),cg=new THREE.ConeGeometry(.8,1.8,7),tm=new THREE.MeshLambertMaterial({color:0x6b4423}),cm=new THREE.MeshLambertMaterial({color:0x2f7d3c});
for(let i=0;i<80;i++){const a=i*2.399,r=29+(i*13)%14,g=new THREE.Group(),t=new THREE.Mesh(tg,tm),c=new THREE.Mesh(cg,cm);t.position.y=.4;c.position.y=1.5;g.add(t,c);g.scale.setScalar(.9+(i%5)*.2);g.position.set(N/2+Math.cos(a)*r,0,N/2+Math.sin(a)*r);g.traverse(o=>o.castShadow=true);scene.add(g)}}
const hover=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02,.5,1.02)),new THREE.LineBasicMaterial({color:0xffffff}));
hover.position.y=-.15;scene.add(hover);

// ---- Parseller ----
const parcels={},oc=new THREE.Color(),pid=(x,z)=>Math.floor(x/PS)+Math.floor(z/PS)*PW;
function repaintAll(){for(let z=0;z<N;z++)for(let x=0;x<N;x++)paint(x+'_'+z)}
onValue(ref(db,'parcels'),s=>{for(const k in parcels)delete parcels[k];Object.assign(parcels,s.val()||{});repaintAll()});
async function claim(){try{await claim0()}catch(e){toast('Parsel alınamadı: '+(e.code||e.message))}}
async function claim0(){
  if(Object.values(parcels).some(p=>p.u===uid))return toast('Zaten bir parselin var');
  const id=pid(Math.round(me.x),Math.round(me.z));let ok=false;
  await runTransaction(ref(db,'parcels/'+id),c=>{ok=false;if(c===null){ok=true;return {u:uid,n:myName,c:hue}}return undefined});
  toast(ok?'Parsel artık senin!':'Bu parsel dolu, başka yere geç');
}
$('claim').onclick=claim;
// ---- Dünya (herkes ortak) ----
const tiles={},objs={},cropGeo=new THREE.CylinderGeometry(.14,.3,1,7);cropGeo.translate(0,.5,0);
let tver=0;
function paint(key){
  const [x,z]=key.split('_').map(Number),d=tiles[key];
  const c=!d?SG():d.s==='soil'?0x8a5a2b:d.s==='crop'?(d.wet?0x4a2f18:0x6b4423):d.s==='path'?0x9c9a92:DECO[d.s]?SG():0xb8a15a;

    if(lvl()<LV[k])return toast('Seviye '+LV[k]+' gerekir');add(tool,-1);gain(1);qadd('plant');save();set(r,{s:'crop',k,t:now()});
  }else if(DECO[tool]){

  }else if(tool==='tree'){
    if(d)return toast('Boş çim bir alan seç');
    if(zn)return toast(MX);
    if(lvl()<2)return toast('Seviye 2 gerekir');
    if(inv.coins<25)return toast('Yetersiz para');
    inv.coins-=25;save();set(r,{s:'tree',t:now()});
  }else if(ANIM[tool]){

  }

    if(g){inv.coins-=g.price;add(g.item,g.qty);save();push(ref(db,'inbox/'+g.u),{coins:g.price});toast('Satın alındı!')}
    else toast('Alınamadı (para yetmiyor veya ilan gitti)');
  }
};

// ---- Dinamik fiyat ----
let econ={};onValue(ref(db,'econ'),s=>{econ=s.val()||{};renderPanel()});
const dec=e=>e?e.n*Math.pow(.5,(now()-e.t)/300000):0;
const price=k=>Math.max(1,Math.round(PRICE[k]*Math.max(.5,Math.min(1.5,1.4-dec(econ[k])/40))));
const sold=k=>runTransaction(ref(db,'econ/'+k),e=>({n:dec(e)+1,t:now()}));
let fr={};onValue(ref(db,'friends/'+uid),s=>{fr=s.val()||{};renderPanel()});
let lb={};onValue(ref(db,'lb'),s=>{lb=s.val()||{};renderPanel()});
const top5=()=>Object.values(lb).sort((a,b)=>b.xp-a.xp).slice(0,5).map((p,i)=>`${i+1}.${esc(p.n)} sv${Math.floor(Math.sqrt(p.xp/20))+1}`).join(' · ')||'—';
// ---- Sohbet ----
onValue(query(ref(db,'chat'),limitToLast(6)),s=>{
  const log=$('log');log.textContent='';
  Object.values(s.val()||{}).forEach(m=>{const d=document.createElement('div');d.textContent=m.n+': '+m.m;log.appendChild(d)});
});
$('chat').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=e.target.value.trim();if(v)push(ref(db,'chat'),{n:myName,m:v.slice(0,120)});e.target.value='';e.target.blur()}
});

let zoom=1,pd=0;
addEventListener('wheel',e=>{if(e.target===ren.domElement)zoom=Math.max(.6,Math.min(2,zoom+e.deltaY*.001))},{passive:true});
ren.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)zoom=Math.max(.6,Math.min(2,zoom*pd/d));pd=d}},{passive:true});
ren.domElement.addEventListener('touchend',()=>pd=0);
let jx=0,jz=0;const joy=$('joy'),kn=$('knob');
const jm=e=>{const t=e.targetTouches[0],r=joy.getBoundingClientRect();let x=(t.clientX-r.left-60)/50,z=(t.clientY-r.top-60)/50;const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}jx=x;jz=z;kn.style.left=40+x*40+'px';kn.style.top=40+z*40+'px';e.preventDefault()};
joy.addEventListener('touchstart',jm,{passive:false});joy.addEventListener('touchmove',jm,{passive:false});
joy.addEventListener('touchend',()=>{jx=jz=0;kn.style.left=kn.style.top='40px'});
const rainAt=t=>((Math.floor(t/180000)*2654435761)>>>0)%4===0;
const rp=new Float32Array(900),rain=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0xaaccff,size:.12}));
for(let i=0;i<900;i+=3){rp[i]=Math.random()*30-15;rp[i+1]=Math.random()*14;rp[i+2]=Math.random()*30-15}
rain.geometry.setAttribute('position',new THREE.BufferAttribute(rp,3));rain.frustumCulled=false;scene.add(rain);
setInterval(()=>{if(!rainAt(now()))return;for(const k in tiles){const d=tiles[k];if(d.s==='crop'&&!d.wet){const[x,z]=k.split('_').map(Number),P=parcels[pid(x,z)];if(P&&P.u===uid)set(ref(db,'world/'+k),{...d,wet:1})}}},5000);
const drops={},picking={},DC={egg:0xfff1cf,milk:0xffffff,wool:0xf4f0e6};
const barnBox=d=>{const c=d._bb;if(c&&c.v===tver)return c.b;const out=[];let b=null;
  if(flood(d.cx,d.cz,q=>q==='barnwall'||q==='gate',out)){let a=1e9,A=-1e9,c1=1e9,C=-1e9;for(const [x,z] of out){a=Math.min(a,x);A=Math.max(A,x);c1=Math.min(c1,z);C=Math.max(C,z)}b=[a-.35,A+.35,c1-.35,C+.35]}
  d._bb={v:tver,b};return b};
const apos=(d,t)=>{const A=ANIM[d.s],tt=t/1000*A.sp+d.ph,bb=barnBox(d);
  if(bb){const w=Math.min(A.r,(bb[1]-bb[0])/2),h=Math.min(A.r,(bb[3]-bb[2])/2);return [(bb[0]+bb[1])/2+Math.sin(tt)*w,(bb[2]+bb[3])/2+Math.cos(tt*.7)*h]}
  const x0=Math.floor(d.cx/PS)*PS,z0=Math.floor(d.cz/PS)*PS;return [Math.max(x0-.3,Math.min(x0+PS-.7,d.cx+Math.sin(tt)*A.r)),Math.max(z0-.3,Math.min(z0+PS-.7,d.cz+Math.cos(tt*.7)*A.r))]};
function mkDrop(it){const g=it==='egg'?new THREE.SphereGeometry(.14,10,8):it==='milk'?new THREE.BoxGeometry(.2,.32,.2):new THREE.BoxGeometry(.3,.3,.3);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:DC[it]||0xffffff}));if(it==='egg')m.scale.y=1.3;m.castShadow=true;return m}
function collect(key,d){const A=ANIM[d.s],el=now()-d.t,n=Math.min(3,Math.floor(el/A.t));if(!n)return false;
  add(A.item,n);gain(4*n);save();set(ref(db,'world/'+key),{s:d.s,t:el>=3*A.t?now():d.t+n*A.t});toast(NAME[A.item]+' ×'+n+' toplandı');return true}
const isW=q=>q&&(q.s==='fence'||q.s==='barnwall');
function flood(x,z,bar,out){const P=pid(x,z),seen=new Set(),st=[[x,z]];let n=0;
  while(st.length){const [a,b]=st.pop(),k=a+'_'+b;if(seen.has(k))continue;seen.add(k);
    if(a<0||b<0||a>=N||b>=N||pid(a,b)!==P)return false;
    const q=tiles[k];if(q&&bar(q.s))continue;
    if(++n>150)return false;if(out)out.push([a,b]);st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}
  return true}
function zoneAt(x,z){const q=tiles[x+'_'+z];if(q&&(q.s==='fence'||q.s==='barnwall'||q.s==='gate'))return null;
  if(flood(x,z,s=>s==='barnwall'||s==='gate'))return 'barn';
  if(flood(x,z,s=>s==='fence'||s==='gate'))return 'field';return null}
const WALL={fence:1,barnwall:1,gate:1},MF='Tarla sadece çitle çevrili alanda açılır (🪵 Çit + 🚪 Kapı)',MB='Hayvanlar sadece ahırın içine konur (🏚️ Ahır duvarı + 🚪 Kapı)',MX='Çitli alana sadece tarla, ahıra sadece hayvan konur';
const GN=60,gday=()=>Math.floor(now()/86400000),gitem=()=>['wheat','carrot','egg','tomato','corn','milk'][gday()%6];let gr={};
onValue(ref(db,'granary/'+gday()),sn=>{gr=sn.val()||{};renderPanel()});
let lastSea=-1,fishing=0,bob=null;
const OP=[['wheat',1],['carrot',1],['egg',1],['tomato',2],['strawberry',2],['flour',2],['corn',3],['wool',3],['bread',3],['milk',4],['cheese',4],['pumpkin',4]];
function orders(){const d=Math.floor(now()/86400000),pool=OP.filter(o=>o[1]<=lvl()),out=[];
  for(let i=0;out.length<3&&i<12;i++){const k=pool[(d*7+i*5+i*i*3)%pool.length][0];if(out.some(o=>o.k===k))continue;const q=2+(d+i*3)%4;out.push({k,q,r:Math.round(PRICE[k]*q*1.5)+10})}return out}
function fish(){if(fishing)return toast('Olta suda, bekle');
  const ds=[me.x,N-1-me.x,me.z,N-1-me.z],mi=ds.indexOf(Math.min(...ds));if(ds[mi]>2.5)return toast('Balık tutmak için haritanın kıyısına git');
  const v=[[-1,0],[1,0],[0,-1],[0,1]][mi];bob=new THREE.Mesh(new THREE.SphereGeometry(.12),new THREE.MeshBasicMaterial({color:0xee3333}));
  bob.position.set(me.x+v[0]*(ds[mi]+1.6),-.3,me.z+v[1]*(ds[mi]+1.6));scene.add(bob);fishing=1;toast('🎣 Olta atıldı...');snd(300);
  setTimeout(()=>{scene.remove(bob);bob=null;fishing=0;const r=Math.random(),k=r<.6?'fish':r<.9?'trout':'goldfish';add(k,1);gain(5);ach('fish');save();toast('🎣 '+NAME[k]+' yakaladın!');snd(700)},2500+Math.random()*3000)}
// ---- Başarımlar ----
const ACH=[['h1','İlk hasat','harvest',1],['h50','Çiftçi (50 hasat)','harvest',50],['s50','Tüccar (50 satış)','sell',50],['p100','Bahçıvan (100 ekim)','plant',100],['f10','Balıkçı (10 balık)','fish',10]];
function ach(t){inv.tot=inv.tot||{};inv.tot[t]=(inv.tot[t]||0)+1;inv.ach=inv.ach||{};for(const [id,nm,ty,n] of ACH)if(!inv.ach[id]&&inv.tot[ty]>=n){inv.ach[id]=1;inv.coins+=50;toast('🏅 Başarım: '+nm+' +50🪙');snd(880,.3)}}
// ---- Ana döngü ----
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.1);
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  dx+=jx;dz+=jz;if(Math.abs(dx)+Math.abs(dz)>.1){const l=Math.hypot(dx,dz);const nx=Math.max(0,Math.min(N-1,me.x+dx/l*5*dt)),nz=Math.max(0,Math.min(N-1,me.z+dz/l*5*dt)),W=(a,b)=>isW(tiles[Math.round(a)+'_'+Math.round(b)]),stuck=W(me.x,me.z);
    if(stuck||!W(nx,me.z))me.x=nx;if(stuck||!W(me.x,nz))me.z=nz;meMesh.rotation.y=Math.atan2(dx,dz)}
  meMesh.position.set(me.x,0,me.z);
  for(const o of Object.values(others)){o.m.position.x+=(o.tx-o.m.position.x)*.2;o.m.position.z+=(o.tz-o.m.position.z)*.2}
  const t=now();meMesh.position.y=(Math.abs(dx)+Math.abs(dz)>.1)?Math.abs(Math.sin(t/90))*.1:0;sun.position.set(me.x+10,20,me.z+8);sun.target.position.set(me.x,0,me.z);
  for(const m of Object.values(objs)){
    const d=m.userData;
    if(d.s==='crop'){const p=Math.min(1,(t-d.t)/gt(d));m.scale.y=.2+.8*p;gB.setHex(RIPE[d.k]);m.material.color.copy(gA).lerp(gB,p*p)}
    else if(DECO[d.s]){}
    else if(d.s==='tree'){const e=m.getObjectByName('egg');if(e)e.visible=t-d.t>=70000}
    else{const A=ANIM[d.s],tt=t/1000*A.sp+d.ph,x0=Math.floor(d.cx/PS)*PS,z0=Math.floor(d.cz/PS)*PS;
      const [px,pz]=apos(d,t);m.position.x=px;m.position.z=pz;
      m.rotation.y=Math.atan2(Math.cos(tt),-.7*Math.sin(tt*.7));
      const e=m.getObjectByName('egg');if(e)e.visible=false}
  }
  for(const key in objs){const m=objs[key],d=m.userData,A=ANIM[d.s];if(!A)continue;const n=Math.min(3,Math.floor((t-d.t)/A.t));
    for(let i=0;i<3;i++){const id=key+'#'+i;let h=drops[id];if(h&&h.userData.t!==d.t){scene.remove(h);delete drops[id];h=null}
      if(i<n&&!h){const [x,z]=apos(d,d.t+(i+1)*A.t),g=mkDrop(A.item);g.position.set(x,.2,z);g.userData={x,z,key,t:d.t};drops[id]=g;scene.add(g)}
      else if(i>=n&&h){scene.remove(h);delete drops[id]}}}
  for(const id in drops){const g=drops[id],u=g.userData;if(!objs[u.key]){scene.remove(g);delete drops[id];continue}
    g.rotation.y+=dt*1.5;g.position.y=.22+Math.sin(t/300+u.x)*.05;
    if(Math.hypot(u.x-me.x,u.z-me.z)<.9&&!picking[u.key]){const P=parcels[pid(u.x,u.z)];if(P&&P.u===uid&&tiles[u.key]){picking[u.key]=1;setTimeout(()=>delete picking[u.key],1500);collect(u.key,tiles[u.key])}}}
  const sea=season();if(sea!==lastSea){lastSea=sea;repaintAll()}if(bob)bob.position.y=-.3+Math.sin(t/150)*.05;
  const rn=rainAt(t);const sn=season()===3;rain.visible=rn||sn;rain.material.color.setHex(sn&&!rn?0xffffff:0xaaccff);rain.material.size=sn&&!rn?.2:.12;$('wx').textContent=SEAS[season()]+' · '+(rn?'🌧️ Yağmur':sn?'Karlı':'Açık')+' · 👥 '+(Object.keys(others).length+1)+' çevrimiçi';
  if(rn||sn){for(let i=1;i<900;i+=3){rp[i]-=(sn&&!rn?3:14)*dt;if(rp[i]<0)rp[i]=14}rain.geometry.attributes.position.needsUpdate=true;rain.position.set(me.x,0,me.z)}
  const dy=(rn?.7:1)*Math.max(.3,Math.sin(t%240000/240000*6.2832)*.5+.65);sun.intensity=.8*dy;amb.intensity=.25+.5*dy;scene.background.setRGB(.6*dy,.83*dy,.96*dy);scene.fog.color.copy(scene.background);
  cam.position.lerp(new THREE.Vector3(me.x,11*zoom,me.z+9*zoom),.1);cam.lookAt(me.x,0,me.z);
  ren.render(scene,cam);
}
hud();loop();
</script></body></html>
